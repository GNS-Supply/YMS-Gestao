<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f2942">
  <title>Agendamento de Pátio - Transportadora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Filtros rápidos de período em "Meus Agendamentos" — mesmo padrão
       visual dos filtros da Portaria no painel da Logística (.btn-filtro),
       reaproveitado aqui pra manter a linguagem visual consistente entre
       as telas. */
    .segmentado {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .segmentado-item {
      padding: 8px 16px;
      border: 1px solid var(--cinza-borda, #ccc);
      background: #f8f9fa;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .segmentado-item.ativo {
      background: var(--azul-escuro, #0f2942);
      color: #fff;
      border-color: var(--azul-escuro, #0f2942);
    }
    .btn-secundario {
      padding: 9px 14px;
      border: 1px solid var(--cinza-borda, #ccc);
      background: #fff;
      color: var(--texto, #1A2229);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-secundario:hover { background: var(--cinza-bg, #EEF0F1); }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="marca"><svg width="18" height="18" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="7" width="13" height="9"></rect><path d="M14 10h4l3 3v3h-7z"></path><circle cx="6" cy="18" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg> Agendamento de Pátio</div>
    <div>
      <span id="user-empresa" style="margin-right:16px; font-size:0.9rem; opacity:.85;"></span>
      <button id="btn-logout">Sair</button>
    </div>
  </div>

  <div class="container">

    <div class="tabs">
      <button class="tab-btn ativo" data-tab="novo">Novo Agendamento</button>
      <button class="tab-btn" data-tab="meus">Meus Agendamentos</button>
    </div>

    <div class="tab-conteudo ativo" id="tab-novo">
      <div class="card">
        <div class="aviso-suporte">
          Caso não encontre o horário desejado, entre em contato diretamente com a equipe de logística pelo canal oficial.
        </div>

        <form id="form-agendamento">
          <div class="campo">
            <label for="empresa">Nome da Empresa</label>
            <input type="text" id="empresa" required>
          </div>

          <div class="campo" id="campo-planta-wrapper" style="display:none;">
            <label for="planta">Planta / Filial</label>
            <select id="planta" required>
              <option value="">Selecione...</option>
            </select>
          </div>

          <div class="campo">
            <label for="tipoProcesso">Tipo de Processo</label>
            <select id="tipoProcesso" required>
              <option value="">Selecione...</option>
            </select>
          </div>

          <div class="campo">
            <label for="data">Data</label>
            <input type="date" id="data" required>
          </div>

          <div class="campo">
            <label>Horário</label>
            <div class="slots-grid" id="slots-grid"></div>
            <div class="slots-msg" id="slots-msg">Selecione uma data para ver os horários disponíveis.</div>
            <input type="hidden" id="horaInicioSelecionada">
          </div>

          <div class="campo">
            <label for="placaCavalo">Placa do Cavalo</label>
            <input type="text" id="placaCavalo" required maxlength="8" placeholder="AAA-0000 ou AAA0A00" style="text-transform:uppercase;" inputmode="text" autocomplete="off">
            <small style="display:block; margin-top:4px; color:var(--texto-suave); font-size:0.78rem;">Formatos aceitos: AAA-0000 (antigo) ou AAA0A00 (Mercosul)</small>
          </div>

          <div class="campo">
            <label for="placaCarreta">Placa da Carreta</label>
            <input type="text" id="placaCarreta" maxlength="8" placeholder="AAA-0000 ou AAA0A00" style="text-transform:uppercase;" inputmode="text" autocomplete="off">
          </div>

          <div class="campo">
            <label for="motorista">Nome do Motorista</label>
            <input type="text" id="motorista" required>
          </div>

          <div class="campo">
            <label for="tipoVeiculo">Tipo de Veículo</label>
            <select id="tipoVeiculo" required>
              <option value="">Selecione...</option>
            </select>
          </div>

          <div class="campo">
            <label for="observacoes">Observações</label>
            <textarea id="observacoes" rows="3" placeholder="Detalhes da carga, restrições de acesso, etc."></textarea>
          </div>

          <button type="submit" class="btn-primario">Confirmar Agendamento</button>
          <div class="erro" id="agendamento-error"></div>
        </form>
      </div>
    </div>

    <div class="tab-conteudo" id="tab-meus">
      <div class="card">
        <!-- Atalhos rápidos de período — mesma lógica do "Painel do Dia" da
             Logística, adaptada para a Transportadora não precisar montar
             filtros toda vez que só quer ver o agendamento de hoje ou
             conferir o histórico do que já passou. -->
        <div class="segmentado" id="segmentado-periodo-rapido" role="group" aria-label="Período">
          <button type="button" class="segmentado-item ativo" data-filtro-rapido="todos">Todos</button>
          <button type="button" class="segmentado-item" data-filtro-rapido="hoje">Hoje</button>
          <button type="button" class="segmentado-item" data-filtro-rapido="futuros">Próximos</button>
          <button type="button" class="segmentado-item" data-filtro-rapido="historico">Histórico</button>
        </div>

        <div style="display:flex; gap:12px; margin-bottom:8px; flex-wrap:wrap; align-items:flex-end;">
          <div class="campo" style="flex:2; min-width:200px; margin:0;">
            <label for="busca-meus-agendamentos">Buscar (motorista ou placa)</label>
            <input type="text" id="busca-meus-agendamentos" placeholder="Ex: João ou AAA0A00">
          </div>
          <div class="campo" style="flex:1; min-width:170px; margin:0;">
            <label for="filtro-tipo-processo-meus">Tipo de Processo</label>
            <select id="filtro-tipo-processo-meus">
              <option value="">Todos</option>
            </select>
          </div>
          <div class="campo" style="flex:1; min-width:170px; margin:0;">
            <label for="filtro-status-meus">Status da Solicitação</label>
            <select id="filtro-status-meus">
              <option value="">Todos</option>
              <option value="pendente">Pendente / Aguardando</option>
              <option value="aprovado">Aprovado / Em Pátio / Concluído</option>
              <option value="recusado">Recusado / Cancelado / No-Show</option>
              <option value="expirado">Expirado</option>
            </select>
          </div>
          <div class="campo" style="flex:1; min-width:150px; margin:0;">
            <label for="ordenar-meus-agendamentos">Ordenar por</label>
            <select id="ordenar-meus-agendamentos">
              <option value="data_desc">Data (mais recente primeiro)</option>
              <option value="data_asc">Data (mais antiga primeiro)</option>
              <option value="horario_asc">Horário (crescente)</option>
              <option value="horario_desc">Horário (decrescente)</option>
              <option value="motorista_asc">Motorista (A-Z)</option>
              <option value="placa_asc">Placa do Cavalo (A-Z)</option>
              <option value="tipo_processo_asc">Tipo de Processo (A-Z)</option>
              <option value="status_asc">Status (A-Z)</option>
            </select>
          </div>
        </div>

        <div style="display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; align-items:flex-end;">
          <div class="campo" style="margin:0;">
            <label for="filtro-data-inicio-meus">Período de — até</label>
            <div style="display:flex; gap:6px; align-items:center;">
              <input type="date" id="filtro-data-inicio-meus" style="max-width:150px;">
              <span style="opacity:0.6;">—</span>
              <input type="date" id="filtro-data-fim-meus" style="max-width:150px;">
            </div>
          </div>
          <button type="button" class="btn-secundario" id="btn-limpar-filtros-meus" style="padding:9px 14px; font-size:0.82rem;">Limpar filtros</button>
          <span id="contador-meus-agendamentos" style="font-size:0.8rem; opacity:0.7; margin-left:auto; align-self:center;"></span>
        </div>

        <div class="lista-agendamentos" id="lista-agendamentos">
          <div class="estado-vazio">Carregando...</div>
        </div>
      </div>
    </div>

  </div>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { protegerPagina, logout } from "./auth.js";
    import {
      collection,
      doc,
      updateDoc,
      addDoc,
      query,
      where,
      getDocs,
      onSnapshot,
      arrayUnion,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
    import {
      buscarSlotsVirtuaisDoDia,
      idSlotHorario,
      criarAgendamentoTransportadora,
      normalizarBooking,
      aplicarMascaraPlaca,
      configurarMascaraPlaca,
      placaCompleta,
      situacaoDetalhadaLabel,
      listarPlantas,
      PLANTA_PADRAO_ID,
      pertenceAPlanta,
      TIPOS_VEICULO
    } from "./patioCore.js";
    // Máscara de placa, disponibilidade e normalização de booking vêm
    // TODOS de patioCore.js — a única implementação do sistema (ver
    // revisão estrutural). O listener em tempo real desta tela usa
    // onSnapshot diretamente (em vez do escutarBookings() genérico do
    // núcleo) porque aqui a consulta PRECISA ser filtrada por
    // usuarioId==uid — as Firestore Rules exigem que a própria query já
    // venha restrita ao dono do documento; um listener sem filtro na
    // coleção inteira seria rejeitado por permissão para este perfil.

    // AUTENTICAÇÃO / PROTEÇÃO DE PÁGINA: reaproveita a versão centralizada
    // em auth.js (exige status === "aprovado"). Esta tela tinha uma cópia
    // local antiga que só bloqueava "pendente_aprovacao" e deixava contas
    // "suspenso"/"recusado" acessarem o painel normalmente — removida.

    let usuarioAtual = null;
    let perfilAtual = null;

    /* ===================================================================
       CAMPO "EMPRESA" — PREENCHIMENTO A PARTIR DO PERFIL (BUGFIX)

       Extraído para função própria porque precisa ser chamado em DOIS
       momentos: (1) no carregamento da página, e (2) depois de QUALQUER
       form.reset() — form.reset() devolve o campo ao valor original do
       HTML (vazio, já que este input nunca teve um atributo value= no
       markup, só recebeu valor via JS), não ao valor preenchido pelo
       perfil. Sem isso, no vínculo "externo" o campo fica readOnly E
       vazio ao mesmo tempo depois do primeiro agendamento — o usuário
       não consegue digitar (readOnly) nem confirmar (campo obrigatório
       vazio), travando qualquer agendamento seguinte.
       =================================================================== */
    function preencherCampoEmpresa(perfil) {
      const inputEmpresa = document.getElementById("empresa");
      if (!inputEmpresa || !perfil || !perfil.empresa) return;

      inputEmpresa.value = perfil.empresa;
      // Parceiro externo: nome da empresa vem fixo do cadastro e não
      // pode ser alterado no formulário (readOnly em vez de disabled
      // para o valor continuar sendo lido normalmente por
      // document.getElementById("empresa").value.trim() na submissão).
      if (perfil.vinculo === "externo") {
        inputEmpresa.readOnly = true;
        inputEmpresa.style.background = "#eee";
        inputEmpresa.style.cursor = "not-allowed";
        inputEmpresa.title = "Empresa vinculada ao seu cadastro — não pode ser alterada aqui. Contate a Logística para corrigir.";
      }
    }

    /* ===================================================================
       POPUP / MODAL CUSTOMIZADO (substitui alert() e confirm() nativos)
       =================================================================== */
    function criarModalHost() {
      if (document.getElementById("modal-overlay")) return;
      const overlay = document.createElement("div");
      overlay.id = "modal-overlay";
      overlay.className = "modal-overlay";
      overlay.innerHTML = `
        <div class="modal-caixa" id="modal-caixa" role="alertdialog" aria-modal="true">
          <div class="modal-icone" id="modal-icone"></div>
          <div class="modal-titulo" id="modal-titulo"></div>
          <div class="modal-mensagem" id="modal-mensagem"></div>
          <div class="modal-botoes" id="modal-botoes"></div>
        </div>`;
      document.body.appendChild(overlay);
    }
    criarModalHost();

    function mostrarAlerta(mensagem, opcoes = {}) {
      const { titulo = "Aviso", tipo = "info" } = opcoes;
      const icones = {
        sucesso: '<svg width="26" height="26" class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polyline points="8 12.5 11 15.5 16 9.5"></polyline></svg>',
        erro: '<svg width="26" height="26" class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 L21.5 20 L2.5 20 Z"></path><line x1="12" y1="9.5" x2="12" y2="14"></line><circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"></circle></svg>',
        info: '<svg width="26" height="26" class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="11" x2="12" y2="16"></line><circle cx="12" cy="8" r="0.6" fill="currentColor" stroke="none"></circle></svg>'
      };
      return new Promise((resolve) => {
        const overlay = document.getElementById("modal-overlay");
        const caixa = document.getElementById("modal-caixa");
        caixa.className = `modal-caixa modal-${tipo}`;
        document.getElementById("modal-icone").innerHTML = icones[tipo] || icones.info;
        document.getElementById("modal-titulo").textContent = titulo;
        document.getElementById("modal-mensagem").textContent = mensagem;
        document.getElementById("modal-botoes").innerHTML =
          `<button type="button" class="modal-btn-primario" id="modal-btn-ok">OK</button>`;
        overlay.classList.add("aberto");

        const btnOk = document.getElementById("modal-btn-ok");
        function fechar() {
          overlay.classList.remove("aberto");
          btnOk.removeEventListener("click", fechar);
          resolve();
        }
        btnOk.addEventListener("click", fechar);
        btnOk.focus();
      });
    }

    function mostrarConfirm(mensagem, opcoes = {}) {
      const { titulo = "Confirmar ação", textoConfirmar = "Confirmar", textoCancelar = "Cancelar", perigo = false } = opcoes;
      return new Promise((resolve) => {
        const overlay = document.getElementById("modal-overlay");
        const caixa = document.getElementById("modal-caixa");
        caixa.className = "modal-caixa modal-pergunta";
        document.getElementById("modal-icone").innerHTML = perigo ? '<svg width="26" height="26" class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 L21.5 20 L2.5 20 Z"></path><line x1="12" y1="9.5" x2="12" y2="14"></line><circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"></circle></svg>' : '<svg width="26" height="26" class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1.3 1-1.3 1.9"></path><circle cx="12" cy="16.5" r="0.6" fill="currentColor" stroke="none"></circle></svg>';
        document.getElementById("modal-titulo").textContent = titulo;
        document.getElementById("modal-mensagem").textContent = mensagem;
        document.getElementById("modal-botoes").innerHTML = `
          <button type="button" class="modal-btn-secundario" id="modal-btn-cancelar">${textoCancelar}</button>
          <button type="button" class="modal-btn-primario ${perigo ? "perigo" : ""}" id="modal-btn-confirmar">${textoConfirmar}</button>
        `;
        overlay.classList.add("aberto");

        const btnConfirmar = document.getElementById("modal-btn-confirmar");
        const btnCancelar = document.getElementById("modal-btn-cancelar");
        function limpar(resultado) {
          overlay.classList.remove("aberto");
          btnConfirmar.removeEventListener("click", onConfirmar);
          btnCancelar.removeEventListener("click", onCancelar);
          resolve(resultado);
        }
        function onConfirmar() { limpar(true); }
        function onCancelar() { limpar(false); }
        btnConfirmar.addEventListener("click", onConfirmar);
        btnCancelar.addEventListener("click", onCancelar);
        btnCancelar.focus();
      });
    }

    // Horários (slots) atualmente exibidos para a data escolhida
    let slotsDoDia = [];

    /* ===================================================================
       TOAST — notificação não-bloqueante para confirmações rápidas de
       sucesso (o modal continua sendo usado para erros e confirmações,
       que precisam travar a tela até o usuário decidir).
       =================================================================== */
    function criarToastHost() {
      if (document.getElementById("toast-container")) return;
      const container = document.createElement("div");
      container.id = "toast-container";
      container.className = "toast-container";
      document.body.appendChild(container);
    }
    criarToastHost();

    function mostrarToast(mensagem, opcoes = {}) {
      const { tipo = "info", duracaoMs = 3500 } = opcoes;
      const icones = {
        sucesso: '<svg width="26" height="26" class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polyline points="8 12.5 11 15.5 16 9.5"></polyline></svg>',
        erro: '<svg width="26" height="26" class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 L21.5 20 L2.5 20 Z"></path><line x1="12" y1="9.5" x2="12" y2="14"></line><circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"></circle></svg>',
        info: '<svg width="26" height="26" class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="11" x2="12" y2="16"></line><circle cx="12" cy="8" r="0.6" fill="currentColor" stroke="none"></circle></svg>'
      };
      const container = document.getElementById("toast-container");

      const toast = document.createElement("div");
      toast.className = `toast toast-${tipo}`;
      toast.innerHTML = `
        <span class="toast-icone">${icones[tipo] || icones.info}</span>
        <span class="toast-mensagem"></span>
        <button type="button" class="toast-fechar" aria-label="Fechar">✕</button>
      `;
      toast.querySelector(".toast-mensagem").textContent = mensagem;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add("visivel"));

      function remover() {
        toast.classList.remove("visivel");
        toast.classList.add("saindo");
        setTimeout(() => toast.remove(), 200);
      }
      const timer = setTimeout(remover, duracaoMs);
      toast.querySelector(".toast-fechar").addEventListener("click", () => {
        clearTimeout(timer);
        remover();
      });
    }

    /* ===================================================================
       DATA/HORA ATUAL (fuso LOCAL do navegador — NÃO usar toISOString()
       aqui, pois ele converte para UTC e gera datas erradas à noite em
       fusos negativos como o do Brasil, ex: 23h de 10/08 em UTC-3 já
       virou "2026-08-11" em UTC, bloqueando o próprio dia 10 no min do
       input e nos cálculos de horário já passado abaixo).
       =================================================================== */
    function dataDeHojeStr() {
      const agora = new Date();
      const ano = agora.getFullYear();
      const mes = String(agora.getMonth() + 1).padStart(2, "0");
      const dia = String(agora.getDate()).padStart(2, "0");
      return `${ano}-${mes}-${dia}`;
    }

    function horaAtualStr() {
      const agora = new Date();
      const h = String(agora.getHours()).padStart(2, "0");
      const m = String(agora.getMinutes()).padStart(2, "0");
      return `${h}:${m}`;
    }

    // ---------------- Elementos do DOM ----------------
    const form = document.getElementById("form-agendamento");
    const selectTipoProcesso = document.getElementById("tipoProcesso");
    const selectTipoVeiculo = document.getElementById("tipoVeiculo");
    selectTipoVeiculo.innerHTML = '<option value="">Selecione...</option>' +
      TIPOS_VEICULO.map(t => `<option value="${t}">${t}</option>`).join("");
    const selectPlanta = document.getElementById("planta");
    const campoPlantaWrapper = document.getElementById("campo-planta-wrapper");
    const inputData = document.getElementById("data");
    const slotsGrid = document.getElementById("slots-grid");
    const slotsMsg = document.getElementById("slots-msg");
    const inputHoraSelecionada = document.getElementById("horaInicioSelecionada");
    const erroBox = document.getElementById("agendamento-error");
    const listaAgendamentos = document.getElementById("lista-agendamentos");
    const inputPlacaCavalo = document.getElementById("placaCavalo");
    const inputPlacaCarreta = document.getElementById("placaCarreta");

    // Planta/filial em que este agendamento será feito. Só existe mais
    // de uma opção quando o Admin cadastrou filiais (ver Admin > Plantas
    // / Filiais); nesse caso o campo aparece e a transportadora escolhe.
    // Com uma única planta (o caso hoje) o campo fica oculto e tudo
    // continua se comportando exatamente como antes.
    let plantaSelecionada = PLANTA_PADRAO_ID;

    // Máscara de placa: importada de patioCore.js. Nenhuma cópia local
    // aqui — ver logistica-dashboard.html, que usa a mesma implementação.
    configurarMascaraPlaca(inputPlacaCavalo);
    configurarMascaraPlaca(inputPlacaCarreta);

    // Não deixa escolher datas retroativas (fuso local, ver dataDeHojeStr)
    if (inputData) {
      inputData.min = dataDeHojeStr();
    }

    document.getElementById("btn-logout")?.addEventListener("click", logout);

    // ---------------- Navegação por abas ----------------
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("ativo"));
        document.querySelectorAll(".tab-conteudo").forEach(c => c.classList.remove("ativo"));
        btn.classList.add("ativo");
        document.getElementById(`tab-${btn.dataset.tab}`)?.classList.add("ativo");

        if (btn.dataset.tab === "meus") {
          iniciarListenerMeusAgendamentos();
        }
      });
    });

    // ---------------- Proteção de Página (Apenas perfil Transportadora - Tipo 1) ----------------
    protegerPagina([1], async (user, perfil) => {
      usuarioAtual = user;
      perfilAtual = perfil;

      const userEmpresaEl = document.getElementById("user-empresa");
      if (userEmpresaEl) {
        userEmpresaEl.textContent = perfil.empresa || perfil.nome || user.email;
      }

      preencherCampoEmpresa(perfil);

      await inicializarSeletorPlanta();
      mapTiposProcessoCache = await obterTiposProcessoMap();
      preencherFiltroTipoProcessoMeus();
      iniciarListenerMeusAgendamentos();
      carregarTiposProcessoAtivos();
    });

    /* ===================================================================
       0. PLANTA / FILIAL — só aparece se houver mais de uma cadastrada
       =================================================================== */
    async function inicializarSeletorPlanta() {
      try {
        const plantas = await listarPlantas(db);
        const ativas = plantas.filter(p => p.ativa !== false);

        if (ativas.length <= 1) {
          plantaSelecionada = ativas[0]?.id || PLANTA_PADRAO_ID;
          campoPlantaWrapper.style.display = "none";
          return;
        }

        campoPlantaWrapper.style.display = "";
        selectPlanta.innerHTML = ativas.map(p => `<option value="${p.id}">${p.nome}</option>`).join("");
        plantaSelecionada = ativas[0].id;
        selectPlanta.value = plantaSelecionada;

        selectPlanta.addEventListener("change", () => {
          plantaSelecionada = selectPlanta.value || PLANTA_PADRAO_ID;
          // Tipo de processo e horários são específicos de cada planta —
          // trocar a planta invalida qualquer seleção feita antes.
          carregarTiposProcessoAtivos();
          inputData.value = "";
          inputHoraSelecionada.value = "";
          slotsGrid.innerHTML = "";
          slotsMsg.textContent = "Selecione uma data para consultar os horários.";
        });
      } catch (err) {
        console.error("Erro ao carregar plantas:", err);
        plantaSelecionada = PLANTA_PADRAO_ID;
        campoPlantaWrapper.style.display = "none";
      }
    }

    /* ===================================================================
       1. CARREGAR TIPOS DE PROCESSO ATIVOS
       =================================================================== */
    async function carregarTiposProcessoAtivos() {
      if (!selectTipoProcesso) return;
      try {
        const q = query(collection(db, "processTypes"), where("ativo", "==", true));
        const snap = await getDocs(q);

        selectTipoProcesso.innerHTML = '<option value="">Selecione o tipo de processo...</option>';
        snap.docs.forEach(docSnap => {
          const p = docSnap.data();
          if (!pertenceAPlanta(p, plantaSelecionada)) return;
          const opt = document.createElement("option");
          opt.value = docSnap.id;
          opt.textContent = p.nome;
          selectTipoProcesso.appendChild(opt);
        });
      } catch (err) {
        console.error("Erro ao carregar tipos de processo:", err);
      }
    }

    /* ===================================================================
       2. CÁLCULO DOS HORÁRIOS DISPONÍVEIS NA DATA
       Não depende mais de vagas "geradas" previamente: qualquer data
       futura já é calculada a partir da Regra Padrão de Atendimento +
       Exceções configuradas pela Logística/Admin (ver patioCore.js).
       =================================================================== */
    inputData?.addEventListener("change", async (e) => {
      const dataSelecionada = e.target.value;
      inputHoraSelecionada.value = "";
      slotsGrid.innerHTML = "";

      if (!dataSelecionada) {
        slotsMsg.textContent = "Selecione uma data para consultar os horários.";
        return;
      }

      slotsMsg.textContent = "Buscando horários disponíveis...";

      try {
        // incluirFechados=false (padrão): horários fechados manualmente
        // pela Logística para esta data não aparecem aqui.
        slotsDoDia = await buscarSlotsVirtuaisDoDia(db, dataSelecionada, { plantaId: plantaSelecionada });

        // Se a data escolhida é HOJE, remove da lista qualquer horário cujo
        // início já passou (ou está em andamento) — não faz sentido oferecer
        // uma janela às 07:00 se já são 08:50, por exemplo.
        if (dataSelecionada === dataDeHojeStr()) {
          const horaAtual = horaAtualStr();
          slotsDoDia = slotsDoDia.filter(s => s.horaInicio > horaAtual);
        }

        if (slotsDoDia.length === 0) {
          slotsMsg.textContent = dataSelecionada === dataDeHojeStr()
            ? "Não há mais horários disponíveis hoje. Selecione outra data."
            : "Nenhum horário de atendimento configurado para esta data.";
          return;
        }

        renderizarSlots();
      } catch (err) {
        console.error("Erro ao consultar horários:", err);
        slotsMsg.textContent = "Erro ao buscar horários para a data selecionada.";
      }
    });

    function renderizarSlots() {
      slotsGrid.innerHTML = "";
      slotsMsg.textContent = "";

      slotsDoDia.forEach(slot => {
        const vagasDisponiveis = slot.capacidadeMax - (slot.ocupados || 0);
        const semVaga = vagasDisponiveis <= 0;

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `btn-slot ${semVaga ? "esgotado" : ""}`;
        btn.disabled = semVaga;

        btn.innerHTML = `
          <div style="font-weight:700; font-size:1rem;">${slot.horaInicio} às ${slot.horaFim}</div>
          <div style="font-size:0.75rem; margin-top:2px;">
            ${semVaga ? "Esgotado" : `${vagasDisponiveis} vaga(s)`}
          </div>
        `;

        if (!semVaga) {
          btn.addEventListener("click", () => {
            document.querySelectorAll(".btn-slot").forEach(b => b.classList.remove("selecionado"));
            btn.classList.add("selecionado");
            inputHoraSelecionada.value = slot.horaInicio;
          });
        }

        slotsGrid.appendChild(btn);
      });
    }

    /* ===================================================================
       3. SUBMISSÃO DE NOVO AGENDAMENTO (TRANSAÇÃO ATÔMICA)
       =================================================================== */
    form?.addEventListener("submit", async (e) => {
      e.preventDefault();
      erroBox.textContent = "";

      const empresa = document.getElementById("empresa").value.trim();
      const tipoProcessoId = selectTipoProcesso.value;
      const dataAgendada = inputData.value;
      const horaInicio = inputHoraSelecionada.value;
      // Reaplica a máscara agora (não só no evento "input") para garantir que
      // colar/autofill/preenchimento programático também fiquem padronizados
      // antes de ir para o Firestore (sem espaços, traços extras, minúsculas etc.)
      const placaCavalo = aplicarMascaraPlaca(document.getElementById("placaCavalo").value);
      const placaCarreta = aplicarMascaraPlaca(document.getElementById("placaCarreta").value);
      document.getElementById("placaCavalo").value = placaCavalo;
      document.getElementById("placaCarreta").value = placaCarreta;
      const motorista = document.getElementById("motorista").value.trim();
      const tipoVeiculo = selectTipoVeiculo.value;
      const observacoes = document.getElementById("observacoes").value.trim();

      if (!horaInicio) {
        erroBox.textContent = "Por favor, selecione um horário disponível no grid acima.";
        return;
      }

      if (!tipoVeiculo) {
        erroBox.textContent = "Selecione o tipo de veículo.";
        return;
      }

      // Trava de segurança: se o usuário demorou para confirmar e o horário
      // selecionado já passou nesse meio tempo (data = hoje), bloqueia o envio.
      if (dataAgendada === dataDeHojeStr() && horaInicio <= horaAtualStr()) {
        erroBox.textContent = "Este horário já passou. Selecione uma data/horário novamente.";
        return;
      }

      if (!placaCompleta(placaCavalo)) {
        erroBox.textContent = "Placa do cavalo incompleta. Use o formato AAA-0000 ou AAA0A00.";
        return;
      }
      if (placaCarreta && !placaCompleta(placaCarreta)) {
        erroBox.textContent = "Placa da carreta incompleta. Use o formato AAA-0000 ou AAA0A00.";
        return;
      }

      // Horário calculado dinamicamente (regra/exceção) que o usuário selecionou.
      // Serve como base de capacidade caso o documento em timeSlots ainda não exista.
      const slotSelecionado = slotsDoDia.find(s => s.horaInicio === horaInicio);
      if (!slotSelecionado) {
        erroBox.textContent = "Este horário não está mais disponível. Selecione a data novamente.";
        return;
      }

      const btnSub = form.querySelector("button[type=submit]");
      btnSub.disabled = true;
      btnSub.textContent = "Reservando vaga...";

      try {
        // Reserva a vaga + cria o agendamento numa única transação atômica
        // (evita que 2 transportadoras peguem a última vaga simultaneamente).
        // Esta rotina é COMPARTILHADA com o "Novo Agendamento Operacional"
        // da Logística/Admin (patioCore.js) — a mesma operação de negócio
        // ("reservar 1 vaga + criar 1 booking"), com o mesmo comportamento
        // de criação "lazy" do timeSlot, em um único lugar.
        const resultado = await criarAgendamentoTransportadora(db, usuarioAtual, {
          empresa,
          tipoProcessoId,
          plantaId: plantaSelecionada,
          dataAgendada,
          horaInicio,
          placaCavalo,
          placaCarreta,
          motorista,
          tipoVeiculo,
          observacoes
        }, slotSelecionado);

        mostrarToast("Solicitação de agendamento enviada com sucesso!", { tipo: "sucesso" });
        form.reset();
        // BUGFIX: form.reset() limpa o campo "empresa" (ele nunca teve
        // value= no HTML, só foi preenchido via JS a partir do perfil) —
        // sem esta linha, o campo ficava vazio E readOnly (vínculo
        // externo) ao mesmo tempo, travando qualquer agendamento seguinte.
        preencherCampoEmpresa(perfilAtual);
        inputHoraSelecionada.value = "";
        slotsGrid.innerHTML = "";
        slotsMsg.textContent = "Selecione uma data para consultar os horários.";

        // Leva o usuário direto para "Meus Agendamentos" com o novo item
        // destacado, em vez de deixar o formulário limpo parado na mesma
        // aba — assim ele já vê a confirmação do que acabou de pedir. O
        // listener em tempo real já está ligado desde o carregamento da
        // página, então só é preciso marcar qual item destacar quando o
        // snapshot com o novo booking chegar (pode já ter chegado antes
        // mesmo da navegação, daí re-renderizar na hora).
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("ativo"));
        document.querySelectorAll(".tab-conteudo").forEach(c => c.classList.remove("ativo"));
        document.querySelector('.tab-btn[data-tab="meus"]')?.classList.add("ativo");
        document.getElementById("tab-meus")?.classList.add("ativo");
        // Reseta os filtros antes de destacar o item novo — senão um
        // filtro de status/período deixado ativo de uma consulta
        // anterior pode esconder o agendamento recém-criado da lista.
        document.getElementById("btn-limpar-filtros-meus")?.click();
        idParaDestacarPendente = resultado.bookingId;
        renderizarListaAgendamentos();

      } catch (err) {
        console.error("Erro na reserva:", err);
        erroBox.textContent = err.message || "Erro ao realizar o agendamento. Tente novamente.";
      } finally {
        btnSub.disabled = false;
        btnSub.textContent = "Confirmar Agendamento";
      }
    });

    /* ===================================================================
       4. MEUS AGENDAMENTOS (tempo real)
       Listener próprio (filtrado por usuarioId==uid, exigido pelas
       Firestore Rules) — não usa getDocs pontual: qualquer decisão da
       Logística (aprovar/recusar/check-in/check-out/no-show) aparece
       aqui sozinho, sem precisar reabrir a aba.
       =================================================================== */
    let meusAgendamentos = [];
    let mapTiposProcessoCache = {};
    let cancelarListenerMeusAgendamentos = null;
    let idParaDestacarPendente = null;
    let buscaMeusAgendamentosTexto = "";
    let ordenacaoMeusAgendamentos = "data_desc";
    // NOVO (organização de "Meus Agendamentos"): filtro rápido de
    // período (todos/hoje/futuros/historico) — vira null assim que a
    // Transportadora escolhe um período customizado abaixo, pra não ter
    // dois filtros de data brigando entre si.
    let filtroRapidoMeus = "todos";
    let filtroDataInicioMeus = "";
    let filtroDataFimMeus = "";
    let filtroTipoProcessoMeus = "";
    let filtroStatusMeus = "";

    document.getElementById("busca-meus-agendamentos")?.addEventListener("input", (e) => {
      buscaMeusAgendamentosTexto = e.target.value.trim();
      renderizarListaAgendamentos();
    });

    document.getElementById("ordenar-meus-agendamentos")?.addEventListener("change", (e) => {
      ordenacaoMeusAgendamentos = e.target.value;
      renderizarListaAgendamentos();
    });

    document.getElementById("filtro-tipo-processo-meus")?.addEventListener("change", (e) => {
      filtroTipoProcessoMeus = e.target.value;
      renderizarListaAgendamentos();
    });

    document.getElementById("filtro-status-meus")?.addEventListener("change", (e) => {
      filtroStatusMeus = e.target.value;
      renderizarListaAgendamentos();
    });

    document.querySelectorAll("#segmentado-periodo-rapido .segmentado-item").forEach(btn => {
      btn.addEventListener("click", () => {
        filtroRapidoMeus = btn.dataset.filtroRapido;
        filtroDataInicioMeus = "";
        filtroDataFimMeus = "";
        const inicioEl = document.getElementById("filtro-data-inicio-meus");
        const fimEl = document.getElementById("filtro-data-fim-meus");
        if (inicioEl) inicioEl.value = "";
        if (fimEl) fimEl.value = "";
        document.querySelectorAll("#segmentado-periodo-rapido .segmentado-item").forEach(b => b.classList.remove("ativo"));
        btn.classList.add("ativo");
        renderizarListaAgendamentos();
      });
    });

    function aoMudarPeriodoCustomizado() {
      // Um período customizado sempre substitui o atalho rápido — evita
      // o usuário achar que escolheu "Histórico" só até uma data X e na
      // verdade os dois filtros estarem combinados de um jeito confuso.
      filtroRapidoMeus = null;
      document.querySelectorAll("#segmentado-periodo-rapido .segmentado-item").forEach(b => b.classList.remove("ativo"));
      renderizarListaAgendamentos();
    }
    document.getElementById("filtro-data-inicio-meus")?.addEventListener("change", (e) => {
      filtroDataInicioMeus = e.target.value;
      aoMudarPeriodoCustomizado();
    });
    document.getElementById("filtro-data-fim-meus")?.addEventListener("change", (e) => {
      filtroDataFimMeus = e.target.value;
      aoMudarPeriodoCustomizado();
    });

    document.getElementById("btn-limpar-filtros-meus")?.addEventListener("click", () => {
      buscaMeusAgendamentosTexto = "";
      filtroTipoProcessoMeus = "";
      filtroStatusMeus = "";
      filtroDataInicioMeus = "";
      filtroDataFimMeus = "";
      filtroRapidoMeus = "todos";
      const buscaEl = document.getElementById("busca-meus-agendamentos");
      if (buscaEl) buscaEl.value = "";
      const tipoEl = document.getElementById("filtro-tipo-processo-meus");
      if (tipoEl) tipoEl.value = "";
      const statusEl = document.getElementById("filtro-status-meus");
      if (statusEl) statusEl.value = "";
      const inicioEl = document.getElementById("filtro-data-inicio-meus");
      if (inicioEl) inicioEl.value = "";
      const fimEl = document.getElementById("filtro-data-fim-meus");
      if (fimEl) fimEl.value = "";
      document.querySelectorAll("#segmentado-periodo-rapido .segmentado-item").forEach(b => b.classList.remove("ativo"));
      document.querySelector('#segmentado-periodo-rapido .segmentado-item[data-filtro-rapido="todos"]')?.classList.add("ativo");
      renderizarListaAgendamentos();
    });

    // Preenche o <select> de Tipo de Processo com o que já foi carregado
    // em mapTiposProcessoCache (id -> nome), assim que ele fica pronto.
    function preencherFiltroTipoProcessoMeus() {
      const select = document.getElementById("filtro-tipo-processo-meus");
      if (!select) return;
      const opcoes = Object.entries(mapTiposProcessoCache).sort((a, b) => a[1].localeCompare(b[1], "pt-BR"));
      select.innerHTML = '<option value="">Todos</option>' +
        opcoes.map(([id, nome]) => `<option value="${id}">${escapeHtml(nome)}</option>`).join("");
    }

    function iniciarListenerMeusAgendamentos() {
      if (cancelarListenerMeusAgendamentos) return;
      const q = query(collection(db, "bookings"), where("usuarioId", "==", usuarioAtual.uid));
      cancelarListenerMeusAgendamentos = onSnapshot(
        q,
        (snap) => {
          meusAgendamentos = snap.docs.map(d => normalizarBooking({ id: d.id, ...d.data() }));
          renderizarListaAgendamentos();
        },
        (err) => {
          console.error("Erro no listener de Meus Agendamentos:", err);
          if (listaAgendamentos) {
            listaAgendamentos.innerHTML = '<div class="estado-vazio">Erro ao carregar seus agendamentos.</div>';
          }
        }
      );
    }

    const CLASSE_BADGE_TRANSPORTADORA = {
      Pendente: "pendente",
      "Sem Resposta": "pendente",
      Aprovado: "aprovado",
      "Em Pátio": "aprovado",
      "Concluído": "aprovado",
      Recusado: "recusado",
      Expirado: "expirado",
      Cancelado: "recusado",
      "No-Show": "recusado"
    };

    const COMPARADORES_ORDENACAO_MEUS = {
      data_desc: (a, b) => (b.dataAgendada || "").localeCompare(a.dataAgendada || "") || (b.horaInicio || "").localeCompare(a.horaInicio || ""),
      data_asc: (a, b) => (a.dataAgendada || "").localeCompare(b.dataAgendada || "") || (a.horaInicio || "").localeCompare(b.horaInicio || ""),
      horario_asc: (a, b) => (a.horaInicio || "").localeCompare(b.horaInicio || ""),
      horario_desc: (a, b) => (b.horaInicio || "").localeCompare(a.horaInicio || ""),
      motorista_asc: (a, b) => (a.motorista || "").localeCompare(b.motorista || "", "pt-BR"),
      placa_asc: (a, b) => (a.placaCavalo || "").localeCompare(b.placaCavalo || "", "pt-BR"),
      tipo_processo_asc: (a, b) => (mapTiposProcessoCache[a.tipoProcessoId] || "").localeCompare(mapTiposProcessoCache[b.tipoProcessoId] || "", "pt-BR"),
      status_asc: (a, b) => situacaoDetalhadaLabel(a).localeCompare(situacaoDetalhadaLabel(b), "pt-BR")
    };

    // NOVO: filtro de período — o atalho rápido (Hoje/Próximos/Histórico)
    // e o período customizado (data início/fim) são mutuamente exclusivos
    // (ver aoMudarPeriodoCustomizado), então só um dos dois está ativo
    // por vez aqui.
    function passaNoFiltroDePeriodo(a) {
      const data = a.dataAgendada || "";
      if (filtroDataInicioMeus || filtroDataFimMeus) {
        if (filtroDataInicioMeus && data < filtroDataInicioMeus) return false;
        if (filtroDataFimMeus && data > filtroDataFimMeus) return false;
        return true;
      }
      const hoje = dataDeHojeStr();
      if (filtroRapidoMeus === "hoje") return data === hoje;
      if (filtroRapidoMeus === "futuros") return data > hoje;
      if (filtroRapidoMeus === "historico") return data !== "" && data < hoje;
      return true; // "todos" ou nenhum filtro ativo
    }

    function filtrarESordenarMeusAgendamentos(lista) {
      let resultado = lista;
      if (buscaMeusAgendamentosTexto) {
        const termo = buscaMeusAgendamentosTexto.toLowerCase();
        resultado = resultado.filter(a => {
          const alvo = `${a.motorista || ""} ${a.placaCavalo || ""} ${a.placaCarreta || ""}`.toLowerCase();
          return alvo.includes(termo);
        });
      }
      if (filtroTipoProcessoMeus) {
        resultado = resultado.filter(a => a.tipoProcessoId === filtroTipoProcessoMeus);
      }
      if (filtroStatusMeus) {
        resultado = resultado.filter(a => (CLASSE_BADGE_TRANSPORTADORA[a.status] || "pendente") === filtroStatusMeus);
      }
      resultado = resultado.filter(passaNoFiltroDePeriodo);
      const comparador = COMPARADORES_ORDENACAO_MEUS[ordenacaoMeusAgendamentos] || COMPARADORES_ORDENACAO_MEUS.data_desc;
      return resultado.slice().sort(comparador);
    }

    function renderizarListaAgendamentos() {
      if (!listaAgendamentos) return;

      if (meusAgendamentos.length === 0) {
        listaAgendamentos.innerHTML = '<div class="estado-vazio">Você ainda não possui agendamentos cadastrados.</div>';
        const contador = document.getElementById("contador-meus-agendamentos");
        if (contador) contador.textContent = "";
        return;
      }

      const agendamentos = filtrarESordenarMeusAgendamentos(meusAgendamentos);

      const contador = document.getElementById("contador-meus-agendamentos");
      if (contador) {
        contador.textContent = agendamentos.length === meusAgendamentos.length
          ? `${agendamentos.length} agendamento(s)`
          : `${agendamentos.length} de ${meusAgendamentos.length} agendamento(s)`;
      }

      if (agendamentos.length === 0) {
        listaAgendamentos.innerHTML = '<div class="estado-vazio">Nenhum agendamento encontrado para este filtro.</div>';
        return;
      }

      listaAgendamentos.innerHTML = "";
      agendamentos.forEach(a => {
        const div = document.createElement("div");
        div.className = "item-agendamento";
        div.dataset.id = a.id;

        const rotulo = situacaoDetalhadaLabel(a);
        const statusClasse = CLASSE_BADGE_TRANSPORTADORA[a.status] || "pendente";
        const podeCancelar = (a.status === "Pendente" || a.status === "Aprovado") && a.operacionalStatus === "SEM_CHECKIN";

        div.innerHTML = `
          <div class="linha-topo">
            <span class="data-hora"><svg width="18" height="18" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><line x1="3" y1="10" x2="21" y2="10"></line><line x1="8" y1="3" x2="8" y2="7"></line><line x1="16" y1="3" x2="16" y2="7"></line></svg> ${formatarData(a.dataAgendada)} às ${escapeHtml(a.horaInicio || "-")}</span>
            <span class="badge ${statusClasse}">${escapeHtml(rotulo)}</span>
          </div>
          <div class="detalhes">
            Processo: <strong>${escapeHtml(mapTiposProcessoCache[a.tipoProcessoId] || "-")}</strong><br>
            Placas: ${escapeHtml(a.placaCavalo || "-")}${a.placaCarreta ? " / " + escapeHtml(a.placaCarreta) : ""}<br>
            Motorista: ${escapeHtml(a.motorista || "-")}<br>
            Veículo: ${escapeHtml(a.tipoVeiculo || "-")}${
              a.checkIn?.tipoVeiculo && a.checkIn.tipoVeiculo !== a.tipoVeiculo
                ? ` <span style="opacity:0.75;">(confirmado na portaria como ${escapeHtml(a.checkIn.tipoVeiculo)})</span>`
                : ""
            }
            ${a.observacoes ? `<br>Obs.: ${escapeHtml(a.observacoes)}` : ""}
          </div>
          ${podeCancelar ? `
            <div style="margin-top:10px;">
              <button type="button" class="btn-acao btn-recusar btn-cancelar-agendamento" data-id="${a.id}">Cancelar Agendamento</button>
            </div>
          ` : ""}
        `;
        listaAgendamentos.appendChild(div);
      });

      listaAgendamentos.querySelectorAll(".btn-cancelar-agendamento").forEach(btn => {
        btn.addEventListener("click", () => cancelarMeuAgendamento(btn.dataset.id, btn));
      });

      if (idParaDestacarPendente) {
        const itemNovo = listaAgendamentos.querySelector(`.item-agendamento[data-id="${idParaDestacarPendente}"]`);
        if (itemNovo) {
          itemNovo.classList.add("destaque-novo");
          itemNovo.scrollIntoView({ behavior: "smooth", block: "center" });
        }
        idParaDestacarPendente = null;
      }
    }

    /* ===================================================================
       5. CANCELAMENTO PELA PRÓPRIA TRANSPORTADORA

       A Transportadora só marca o status como "Cancelado" — ela não tem
       permissão para mexer em timeSlots (ver firestore.rules), então a
       vaga em si é liberada depois, numa rotina que roda quando a
       Logística/Admin abre o painel deles. Ou seja: a reserva some da
       sua lista na hora, mas a vaga pode levar um pouco pra reaparecer
       como disponível pra outras transportadoras.
       =================================================================== */
    async function cancelarMeuAgendamento(bookingId, btn) {
      const confirmado = await mostrarConfirm(
        "Tem certeza que deseja cancelar este agendamento? Essa ação não pode ser desfeita.",
        { titulo: "Cancelar agendamento", perigo: true, textoConfirmar: "Cancelar Agendamento" }
      );
      if (!confirmado) return;

      btn.disabled = true;
      btn.textContent = "Cancelando...";

      try {
        await updateDoc(doc(db, "bookings", bookingId), {
          status: "Cancelado",
          aprovacaoStatus: "CANCELADO",
          historicoEstados: arrayUnion({
            dataHora: new Date(),
            dimensaoAlterada: "aprovacaoStatus",
            valorAnterior: null,
            novoValor: "CANCELADO",
            usuarioId: usuarioAtual.uid
          }),
          atualizadoEm: serverTimestamp(),
          atualizadoPor: usuarioAtual.uid
        });

        try {
          await addDoc(collection(db, "auditLogs"), {
            bookingId,
            usuarioId: usuarioAtual.uid,
            acao: "Cancelou",
            dataHora: serverTimestamp()
          });
        } catch (errAudit) {
          console.error("Erro ao registrar log de auditoria:", errAudit);
        }

        mostrarToast("Agendamento cancelado.", { tipo: "sucesso" });
        // O listener em tempo real re-renderiza sozinho; não é preciso
        // recarregar a lista manualmente aqui.
      } catch (err) {
        console.error("Erro ao cancelar agendamento:", err);
        await mostrarAlerta("Erro ao cancelar o agendamento. Tente novamente.", { titulo: "Erro", tipo: "erro" });
        btn.disabled = false;
        btn.textContent = "Cancelar Agendamento";
      }
    }

    /* ===================================================================
       UTILITÁRIOS
       =================================================================== */
    async function obterTiposProcessoMap() {
      const map = {};
      try {
        const snap = await getDocs(collection(db, "processTypes"));
        snap.docs.forEach(d => {
          map[d.id] = d.data().nome;
        });
      } catch (err) {
        console.error(err);
      }
      return map;
    }

    function formatarData(dataStr) {
      if (!dataStr) return "-";
      const [ano, mes, dia] = dataStr.split("-");
      return `${dia}/${mes}/${ano}`;
    }

    function escapeHtml(texto) {
      if (!texto) return "";
      return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
