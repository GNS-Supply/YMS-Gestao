<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento de Pátio - Login</title>
  <link rel="stylesheet" href="Style.css">
</head>
<body>

  <div class="login-wrap">
    <div class="login-card">
      <div class="logo">🚛 Agendamento de Pátio</div>
      <div class="subtitulo">Entre com seu e-mail e senha cadastrados</div>

      <form id="login-form">
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" required autocomplete="username">
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primario">Entrar</button>
        <div class="erro" id="login-error"></div>
      </form>

      <div class="login-links">
        <a href="Cadastro.html">Criar conta</a>
        <span class="separador">·</span>
        <a href="RecuperarSenha.html">Esqueci minha senha</a>
      </div>
    </div>
  </div>

  <script type="module" src="Firebase-config.js"></script>
  <script type="module" src="Auth.js"></script>
</body>
</html>
