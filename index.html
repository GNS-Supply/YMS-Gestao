<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f2942">
  <title>Agendamento de Pátio - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-wrap">
    <div class="login-card">
      <div class="logo"><svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="7" width="13" height="9"></rect><path d="M14 10h4l3 3v3h-7z"></path><circle cx="6" cy="18" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg> Agendamento de Pátio</div>
      <div class="subtitulo">Entre com seu e-mail e senha cadastrados</div>

      <form id="login-form">
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" required autocomplete="username">
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <div class="campo-senha-wrap">
            <input type="password" id="senha" required autocomplete="current-password">
            <button type="button" class="btn-toggle-senha" data-target="senha" aria-label="Mostrar senha"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
          </div>
        </div>
        <button type="submit" class="btn-primario">Entrar</button>
        <div class="erro" id="login-error"></div>
      </form>

      <div class="login-links">
        <a href="cadastro.html">Criar conta</a>
        <span class="separador">·</span>
        <a href="recuperarsenha.html">Esqueci minha senha</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import {
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import {
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("login-error");

    // Botão "mostrar/ocultar senha"
    const ICONE_OLHO = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    const ICONE_OLHO_FECHADO = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"></path><path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.1 4.1"></path><path d="M6.2 6.2C3.6 7.9 2 12 2 12s3.5 7 10 7a10.7 10.7 0 0 0 4-.8"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>';
    document.querySelectorAll(".btn-toggle-senha").forEach(btn => {
      btn.addEventListener("click", () => {
        const input = document.getElementById(btn.dataset.target);
        if (!input) return;
        const mostrando = input.type === "text";
        input.type = mostrando ? "password" : "text";
        btn.innerHTML = mostrando ? ICONE_OLHO : ICONE_OLHO_FECHADO;
        btn.setAttribute("aria-label", mostrando ? "Mostrar senha" : "Ocultar senha");
      });
    });

    // Mapa de redirecionamento por tipo de perfil (arquivos todos na raiz)
    const ROTAS_POR_TIPO = {
      1: "transportadora-dashboard.html",
      2: "logistica-dashboard.html",
      3: "admin-dashboard.html"
    };

    form?.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.textContent = "";

      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;
      const btn = form.querySelector("button[type=submit]");
      btn.disabled = true;
      btn.textContent = "Entrando...";

      try {
        const cred = await signInWithEmailAndPassword(auth, email, senha);
        const userSnap = await getDoc(doc(db, "users", cred.user.uid));

        if (!userSnap.exists()) {
          throw new Error("Usuário autenticado, mas sem perfil cadastrado. Contate o administrador.");
        }

        const dadosUser = userSnap.data();

        if (dadosUser.status === "pendente_aprovacao") {
          await signOut(auth);
          throw new Error("Seu cadastro ainda está aguardando aprovação de um administrador.");
        }
        if (dadosUser.status === "suspenso") {
          await signOut(auth);
          throw new Error("Sua conta está suspensa. Entre em contato com um administrador.");
        }
        if (dadosUser.status === "recusado") {
          await signOut(auth);
          throw new Error("Seu cadastro foi recusado. Entre em contato com um administrador.");
        }
        if (dadosUser.status !== "aprovado") {
          await signOut(auth);
          throw new Error("Sua conta não está com acesso liberado no momento.");
        }

        const rota = ROTAS_POR_TIPO[dadosUser.tipo];
        if (!rota) {
          await signOut(auth);
          throw new Error("Perfil de usuário inválido ou sem acesso definido.");
        }

        window.location.href = rota;
      } catch (err) {
        console.error(err);
        errorBox.textContent = traduzErro(err.code) || err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = "Entrar";
      }
    });

    function traduzErro(code) {
      const mapa = {
        "auth/invalid-email": "E-mail inválido.",
        "auth/user-not-found": "Usuário não encontrado.",
        "auth/wrong-password": "Senha incorreta.",
        "auth/invalid-credential": "E-mail ou senha incorretos.",
        "auth/too-many-requests": "Muitas tentativas. Tente novamente em alguns minutos."
      };
      return mapa[code];
    }
  </script>
</body>
</html>
