<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f2942">
  <title>Agendamento de Pátio - Criar Conta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-wrap">
    <div class="login-card login-card-larga">
      <div class="logo"><svg width="26" height="26" class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="7" width="13" height="9"></rect><path d="M14 10h4l3 3v3h-7z"></path><circle cx="6" cy="18" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg> Criar Conta</div>
      <div class="subtitulo">Preencha os dados para solicitar seu acesso</div>

      <form id="cadastro-form">
        <div class="campo">
          <label for="nome">Nome de usuário</label>
          <input type="text" id="nome" required autocomplete="name">
        </div>

        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" required autocomplete="username">
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <div class="campo-senha-wrap">
            <input type="password" id="senha" required minlength="6" autocomplete="new-password">
            <button type="button" class="btn-toggle-senha" data-target="senha" aria-label="Mostrar senha"><svg width="18" height="18" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
          </div>
        </div>

        <div class="campo">
          <label for="confirmarSenha">Confirmar Senha</label>
          <div class="campo-senha-wrap">
            <input type="password" id="confirmarSenha" required minlength="6" autocomplete="new-password">
            <button type="button" class="btn-toggle-senha" data-target="confirmarSenha" aria-label="Mostrar senha"><svg width="18" height="18" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
          </div>
        </div>

        <div class="campo">
          <label>Qual o seu vínculo com o pátio?</label>
          <div class="campo-radio">
            <label class="radio-opcao">
              <input type="radio" name="vinculo" value="interno" checked>
              Colaborador da empresa
            </label>
            <label class="radio-opcao">
              <input type="radio" name="vinculo" value="externo">
              Empresa parceira (cliente, fornecedor ou transportadora)
            </label>
          </div>
        </div>

        <div id="campos-externo" style="display:none;">
          <div class="campo">
            <label for="empresa">Nome da Empresa</label>
            <input type="text" id="empresa">
          </div>
          <div class="campo">
            <label for="tipoVinculo">Tipo de Vínculo</label>
            <select id="tipoVinculo">
              <option value="Transportadora">Transportadora</option>
              <option value="Cliente">Cliente</option>
              <option value="Fornecedor">Fornecedor</option>
              <option value="Outro">Outro</option>
            </select>
          </div>
        </div>

        <div class="aviso-suporte" id="aviso-interno">
          Cadastros de colaboradores internos precisam ser aprovados por um administrador antes do primeiro acesso.
        </div>

        <button type="submit" class="btn-primario">Criar Conta</button>
        <div class="erro" id="cadastro-error"></div>
      </form>

      <div class="login-links">
        <a href="index.html">Já tenho conta — Entrar</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import {
      createUserWithEmailAndPassword,
      signOut,
      deleteUser
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import {
      doc, setDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    // Mapa de redirecionamento por tipo de perfil (duplicado de index.html)
    const ROTAS_POR_TIPO = {
      1: "transportadora-dashboard.html",
      2: "logistica-dashboard.html",
      3: "admin-dashboard.html"
    };

    const form = document.getElementById("cadastro-form");
    const errorBox = document.getElementById("cadastro-error");
    const camposExterno = document.getElementById("campos-externo");
    const avisoInterno = document.getElementById("aviso-interno");

    /* ===================================================================
       POPUP / MODAL CUSTOMIZADO (substitui alert() e confirm() nativos)
       =================================================================== */
    function criarModalHost() {
      if (document.getElementById("modal-overlay")) return;
      const overlay = document.createElement("div");
      overlay.id = "modal-overlay";
      overlay.className = "modal-overlay";
      overlay.innerHTML = `
        <div class="modal-caixa" id="modal-caixa" role="alertdialog" aria-modal="true">
          <div class="modal-icone" id="modal-icone"></div>
          <div class="modal-titulo" id="modal-titulo"></div>
          <div class="modal-mensagem" id="modal-mensagem"></div>
          <div class="modal-botoes" id="modal-botoes"></div>
        </div>`;
      document.body.appendChild(overlay);
    }
    criarModalHost();

    function mostrarAlerta(mensagem, opcoes = {}) {
      const { titulo = "Aviso", tipo = "info" } = opcoes;
      const icones = {
        sucesso: '<svg width="26" height="26" class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polyline points="8 12.5 11 15.5 16 9.5"></polyline></svg>',
        erro: '<svg width="26" height="26" class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 L21.5 20 L2.5 20 Z"></path><line x1="12" y1="9.5" x2="12" y2="14"></line><circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"></circle></svg>',
        info: '<svg width="26" height="26" class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="11" x2="12" y2="16"></line><circle cx="12" cy="8" r="0.6" fill="currentColor" stroke="none"></circle></svg>'
      };
      return new Promise((resolve) => {
        const overlay = document.getElementById("modal-overlay");
        const caixa = document.getElementById("modal-caixa");
        caixa.className = `modal-caixa modal-${tipo}`;
        document.getElementById("modal-icone").innerHTML = icones[tipo] || icones.info;
        document.getElementById("modal-titulo").textContent = titulo;
        document.getElementById("modal-mensagem").textContent = mensagem;
        document.getElementById("modal-botoes").innerHTML =
          `<button type="button" class="modal-btn-primario" id="modal-btn-ok">OK</button>`;
        overlay.classList.add("aberto");

        const btnOk = document.getElementById("modal-btn-ok");
        function fechar() {
          overlay.classList.remove("aberto");
          btnOk.removeEventListener("click", fechar);
          resolve();
        }
        btnOk.addEventListener("click", fechar);
        btnOk.focus();
      });
    }

    function mostrarConfirm(mensagem, opcoes = {}) {
      const { titulo = "Confirmar ação", textoConfirmar = "Confirmar", textoCancelar = "Cancelar", perigo = false } = opcoes;
      return new Promise((resolve) => {
        const overlay = document.getElementById("modal-overlay");
        const caixa = document.getElementById("modal-caixa");
        caixa.className = "modal-caixa modal-pergunta";
        document.getElementById("modal-icone").innerHTML = perigo ? '<svg width="26" height="26" class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 L21.5 20 L2.5 20 Z"></path><line x1="12" y1="9.5" x2="12" y2="14"></line><circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"></circle></svg>' : '<svg width="26" height="26" class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1.3 1-1.3 1.9"></path><circle cx="12" cy="16.5" r="0.6" fill="currentColor" stroke="none"></circle></svg>';
        document.getElementById("modal-titulo").textContent = titulo;
        document.getElementById("modal-mensagem").textContent = mensagem;
        document.getElementById("modal-botoes").innerHTML = `
          <button type="button" class="modal-btn-secundario" id="modal-btn-cancelar">${textoCancelar}</button>
          <button type="button" class="modal-btn-primario ${perigo ? "perigo" : ""}" id="modal-btn-confirmar">${textoConfirmar}</button>
        `;
        overlay.classList.add("aberto");

        const btnConfirmar = document.getElementById("modal-btn-confirmar");
        const btnCancelar = document.getElementById("modal-btn-cancelar");
        function limpar(resultado) {
          overlay.classList.remove("aberto");
          btnConfirmar.removeEventListener("click", onConfirmar);
          btnCancelar.removeEventListener("click", onCancelar);
          resolve(resultado);
        }
        function onConfirmar() { limpar(true); }
        function onCancelar() { limpar(false); }
        btnConfirmar.addEventListener("click", onConfirmar);
        btnCancelar.addEventListener("click", onCancelar);
        btnCancelar.focus();
      });
    }

    // Botão "mostrar/ocultar senha" (senha e confirmar senha)
    const ICONE_OLHO = '<svg width="18" height="18" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    const ICONE_OLHO_FECHADO = '<svg width="18" height="18" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"></path><path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.1 4.1"></path><path d="M6.2 6.2C3.6 7.9 2 12 2 12s3.5 7 10 7a10.7 10.7 0 0 0 4-.8"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>';
    document.querySelectorAll(".btn-toggle-senha").forEach(btn => {
      btn.addEventListener("click", () => {
        const input = document.getElementById(btn.dataset.target);
        if (!input) return;
        const mostrando = input.type === "text";
        input.type = mostrando ? "password" : "text";
        btn.innerHTML = mostrando ? ICONE_OLHO : ICONE_OLHO_FECHADO;
        btn.setAttribute("aria-label", mostrando ? "Mostrar senha" : "Ocultar senha");
      });
    });

    // Alterna os campos extras conforme o vínculo escolhido
    document.querySelectorAll('input[name="vinculo"]').forEach(radio => {
      radio.addEventListener("change", (e) => {
        const externo = e.target.value === "externo";
        camposExterno.style.display = externo ? "block" : "none";
        avisoInterno.style.display = externo ? "none" : "block";
        document.getElementById("empresa").required = externo;
      });
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.textContent = "";

      const nome = document.getElementById("nome").value.trim();
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;
      const confirmarSenha = document.getElementById("confirmarSenha").value;
      const vinculo = document.querySelector('input[name="vinculo"]:checked').value;

      if (senha !== confirmarSenha) {
        errorBox.textContent = "As senhas não coincidem.";
        return;
      }

      let empresa = "";
      let tipoVinculo = "";
      if (vinculo === "externo") {
        empresa = document.getElementById("empresa").value.trim();
        tipoVinculo = document.getElementById("tipoVinculo").value;
        if (!empresa) {
          errorBox.textContent = "Informe o nome da empresa.";
          return;
        }
      }

      const btn = form.querySelector("button[type=submit]");
      btn.disabled = true;
      btn.textContent = "Criando conta...";

      let cred;
      try {
        cred = await createUserWithEmailAndPassword(auth, email, senha);
      } catch (err) {
        console.error(err);
        errorBox.textContent = traduzErro(err.code) || "Não foi possível criar a conta.";
        btn.disabled = false;
        btn.textContent = "Criar Conta";
        return;
      }

      try {
        // NOTA IMPORTANTE: o "primeiro usuário vira Admin Master automaticamente"
        // foi removido daqui de propósito. Ele fazia uma consulta
        // (getDocs sobre a coleção "users") que as Firestore Rules atuais
        // NEGAM para qualquer pessoa que não seja Logística/Admin/dona do
        // próprio doc — ou seja, funcionava só na conta fundadora (quando a
        // coleção estava vazia) e QUEBRAVA o cadastro de todo mundo depois
        // disso com "Não foi possível concluir o cadastro" (o erro de
        // permissão da consulta caía no catch e desfazia a conta criada).
        //
        // O Admin Master inicial deve ser criado manualmente (Console do
        // Firebase > Authentication, criar o usuário, e depois Firestore >
        // criar o documento em users/{uid} com tipo:3 e status:"aprovado" —
        // ou via Admin SDK/Cloud Function, que não passa pelas Rules).
        const dadosBase = {
          nome,
          email,
          vinculo, // "interno" | "externo"
          criadoEm: serverTimestamp()
        };

        const dadosUser = vinculo === "interno"
          ? { ...dadosBase, tipo: null, status: "pendente_aprovacao" }
          : { ...dadosBase, tipo: 1, status: "aprovado", empresa, tipoVinculo };

        await setDoc(doc(db, "users", cred.user.uid), dadosUser);

        if (dadosUser.status === "pendente_aprovacao") {
          await signOut(auth);
          await mostrarAlerta("Cadastro enviado! Você poderá entrar assim que um administrador aprovar seu acesso.", { titulo: "Cadastro enviado", tipo: "sucesso" });
          window.location.href = "index.html";
          return;
        }

        // Aprovado (empresa parceira) — já segue direto para a área correta
        window.location.href = ROTAS_POR_TIPO[dadosUser.tipo];

      } catch (err) {
        console.error(err);
        // A conta no Auth já foi criada mas o perfil no Firestore falhou —
        // desfaz a criação da conta para não deixar usuário "fantasma" sem perfil.
        try { await deleteUser(cred.user); } catch (_) {}
        errorBox.textContent = "Não foi possível concluir o cadastro. Tente novamente.";
        btn.disabled = false;
        btn.textContent = "Criar Conta";
      }
    });

    function traduzErro(code) {
      const mapa = {
        "auth/email-already-in-use": "Este e-mail já está cadastrado.",
        "auth/invalid-email": "E-mail inválido.",
        "auth/weak-password": "A senha precisa ter no mínimo 6 caracteres."
      };
      return mapa[code];
    }
  </script>
</body>
</html>
