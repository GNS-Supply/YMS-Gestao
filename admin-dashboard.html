<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f2942">
  <title>Agendamento de Pátio - Painel Administrativo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="topbar">
    <div class="marca">⚙️ Painel Administrativo Exclusivo</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <a href="logistica-dashboard.html" style="color:var(--branco); font-size:0.85rem; opacity:.9; text-decoration:underline;">
        🚛 Painel de Logística
      </a>
      <span id="user-empresa" style="font-size:0.9rem; opacity:.85;"></span>
      <button id="btn-logout">Sair</button>
    </div>
  </div>

  <div class="container">

    <div class="card">
      <h3>Gestão Completa de Usuários</h3>
      <p style="font-size:0.85rem; color:var(--texto-suave); margin-bottom:12px;">
        Altere o tipo de acesso, ative/suspenda contas e corrija o nome da empresa parceira de qualquer usuário do sistema.
      </p>

      <div class="aviso-suporte" id="aviso-pendentes" style="display:none; margin-bottom:16px;"></div>

      <div style="display: flex; gap: 12px; margin-bottom: 15px; flex-wrap: wrap;">
        <input type="text" id="filtro-busca" placeholder="🔍 Buscar por nome, e-mail ou empresa..." style="flex: 1; min-width: 200px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--cinza-borda, #ccc);">
        <select id="filtro-status" style="padding: 8px 12px; border-radius: 6px; border: 1px solid var(--cinza-borda, #ccc);">
          <option value="todos">Todos os Status</option>
          <option value="pendente_aprovacao">Pendentes de Aprovação</option>
          <option value="aprovado">Ativos / Aprovados</option>
          <option value="suspenso">Suspensos</option>
          <option value="recusado">Recusados</option>
        </select>
      </div>

      <div class="tabela-wrapper">
        <table class="tabela-padrao">
          <thead>
            <tr>
              <th>Nome</th>
              <th>E-mail</th>
              <th>Vínculo / Empresa</th>
              <th>Tipo de Acesso</th>
              <th>Status da Conta</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tb-todos-usuarios">
            <tr>
              <td colspan="6" class="estado-vazio">Carregando usuários...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import {
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import {
      collection,
      doc,
      getDoc,
      getDocs,
      updateDoc,
      query,
      where,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    let usuarioAtual = null;
    let todosUsuarios = [];

    /* ===================================================================
       PROTEÇÃO DE PÁGINA (Apenas Admin Master - Tipo 3)
       =================================================================== */
    function protegerPagina(tiposPermitidos, callback) {
      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          window.location.href = "index.html";
          return;
        }
        const snap = await getDoc(doc(db, "users", user.uid));
        if (!snap.exists() || snap.data().status === "pendente_aprovacao" || !tiposPermitidos.includes(snap.data().tipo)) {
          await signOut(auth);
          window.location.href = "index.html";
          return;
        }
        callback(user, snap.data());
      });
    }

    async function logout() {
      await signOut(auth);
      window.location.href = "index.html";
    }

    /* ===================================================================
       MODAL DE ALERTA CUSTOMIZADO
       =================================================================== */
    function criarModalHost() {
      if (document.getElementById("modal-overlay")) return;
      const overlay = document.createElement("div");
      overlay.id = "modal-overlay";
      overlay.className = "modal-overlay";
      overlay.innerHTML = `
        <div class="modal-caixa" id="modal-caixa" role="alertdialog" aria-modal="true">
          <div class="modal-icone" id="modal-icone"></div>
          <div class="modal-titulo" id="modal-titulo"></div>
          <div class="modal-mensagem" id="modal-mensagem"></div>
          <div class="modal-botoes" id="modal-botoes"></div>
        </div>`;
      document.body.appendChild(overlay);
    }
    criarModalHost();

    function mostrarAlerta(mensagem, opcoes = {}) {
      const { titulo = "Aviso", tipo = "info" } = opcoes;
      const icones = { sucesso: "✅", erro: "⚠️", info: "ℹ️" };
      return new Promise((resolve) => {
        const overlay = document.getElementById("modal-overlay");
        const caixa = document.getElementById("modal-caixa");
        caixa.className = `modal-caixa modal-${tipo}`;
        document.getElementById("modal-icone").textContent = icones[tipo] || icones.info;
        document.getElementById("modal-titulo").textContent = titulo;
        document.getElementById("modal-mensagem").textContent = mensagem;
        document.getElementById("modal-botoes").innerHTML =
          `<button type="button" class="modal-btn-primario" id="modal-btn-ok">OK</button>`;
        overlay.classList.add("aberto");

        const btnOk = document.getElementById("modal-btn-ok");
        function fechar() {
          overlay.classList.remove("aberto");
          btnOk.removeEventListener("click", fechar);
          resolve();
        }
        btnOk.addEventListener("click", fechar);
        btnOk.focus();
      });
    }

    document.getElementById("btn-logout").addEventListener("click", logout);

    // Proteção de Acesso
    protegerPagina([3], (user, perfil) => {
      usuarioAtual = user;
      document.getElementById("user-empresa").textContent = `${perfil.nome || user.email} (Admin)`;

      carregarTodosUsuarios();
      carregarResumoPendentes();
    });

    /* ==========================================================================
       AVISO DE COLABORADORES PENDENTES
       ========================================================================== */
    async function carregarResumoPendentes() {
      const aviso = document.getElementById("aviso-pendentes");
      if (!aviso) return;

      try {
        const snap = await getDocs(query(collection(db, "users"), where("status", "==", "pendente_aprovacao")));

        if (snap.empty) {
          aviso.style.display = "none";
          return;
        }

        aviso.style.display = "block";
        aviso.innerHTML = `Há <strong>${snap.size}</strong> colaborador(es) aguardando aprovação de acesso.
          Isso pode ser feito na aba <em>"Aprovação de Usuários"</em> do
          <a href="logistica-dashboard.html" style="color:var(--azul-escuro, #0f2942); font-weight:600;">Painel de Logística</a>,
          ou diretamente aqui na tabela abaixo.`;
      } catch (err) {
        console.error("Erro ao verificar colaboradores pendentes:", err);
      }
    }

    /* ==========================================================================
       CARREGAR E FILTRAR USUÁRIOS
       ========================================================================== */
    async function carregarTodosUsuarios() {
      const tbody = document.getElementById("tb-todos-usuarios");
      tbody.innerHTML = '<tr><td colspan="6" class="estado-vazio">Carregando usuários...</td></tr>';

      try {
        const snap = await getDocs(collection(db, "users"));

        if (snap.empty) {
          tbody.innerHTML = '<tr><td colspan="6" class="estado-vazio">Nenhum usuário cadastrado.</td></tr>';
          return;
        }

        todosUsuarios = [];
        snap.forEach(d => todosUsuarios.push({ id: d.id, ...d.data() }));
        todosUsuarios.sort((a, b) => (a.nome || "").localeCompare(b.nome || "", "pt-BR"));

        renderizarTabela();
      } catch (err) {
        console.error(err);
        tbody.innerHTML = '<tr><td colspan="6" class="estado-vazio">Erro ao carregar lista de usuários.</td></tr>';
      }
    }

    function renderizarTabela() {
      const tbody = document.getElementById("tb-todos-usuarios");
      const termo = document.getElementById("filtro-busca").value.toLowerCase();
      const statusFiltro = document.getElementById("filtro-status").value;

      const filtrados = todosUsuarios.filter(u => {
        const bateTexto = (u.nome || "").toLowerCase().includes(termo) ||
                          (u.email || "").toLowerCase().includes(termo) ||
                          (u.empresa || "").toLowerCase().includes(termo);
        const bateStatus = statusFiltro === "todos" || u.status === statusFiltro;
        return bateTexto && bateStatus;
      });

      if (filtrados.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="estado-vazio">Nenhum usuário encontrado.</td></tr>';
        return;
      }

      tbody.innerHTML = "";
      filtrados.forEach(u => {
        const ehEuMesmo = u.id === usuarioAtual.uid;
        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td data-label="Nome">
            ${escapeHtml(u.nome || "-")}
            ${ehEuMesmo ? '<br><small style="color:var(--texto-suave);">(sua conta)</small>' : ""}
          </td>
          <td data-label="E-mail">${escapeHtml(u.email || "-")}</td>
          <td data-label="Vínculo / Empresa">
            <span style="font-size:0.78rem; color:var(--texto-suave); display:block;">${u.vinculo === "interno" ? "Colaborador Interno" : "Empresa Parceira"}</span>
            <input type="text" class="input-empresa" data-id="${u.id}" value="${escapeHtml(u.empresa || "")}"
                   placeholder="Nome da empresa"
                   style="margin-top:4px; padding:6px 8px; border:1px solid var(--cinza-borda, #ccc); border-radius:4px; font-size:0.82rem; width:100%;">
          </td>
          <td data-label="Tipo de Acesso">
            <select class="select-alterar-tipo" data-id="${u.id}" ${ehEuMesmo ? "disabled" : ""} style="padding:6px; border-radius:4px; font-size:0.85rem;">
              <option value="1" ${u.tipo === 1 ? "selected" : ""}>Transportadora (1)</option>
              <option value="2" ${u.tipo === 2 ? "selected" : ""}>Logística (2)</option>
              <option value="3" ${u.tipo === 3 ? "selected" : ""}>Administrador (3)</option>
            </select>
          </td>
          <td data-label="Status da Conta">
            <select class="select-alterar-status" data-id="${u.id}" ${ehEuMesmo ? "disabled" : ""} style="padding:6px; border-radius:4px; font-size:0.85rem;">
              <option value="aprovado" ${u.status === "aprovado" ? "selected" : ""}>Ativo</option>
              <option value="suspenso" ${u.status === "suspenso" ? "selected" : ""}>Suspenso</option>
              <option value="pendente_aprovacao" ${u.status === "pendente_aprovacao" ? "selected" : ""}>Pendente</option>
              <option value="recusado" ${u.status === "recusado" ? "selected" : ""}>Recusado</option>
            </select>
          </td>
          <td data-label="Ações">
            <button class="btn-acao btn-salvar-usuario" data-id="${u.id}" ${ehEuMesmo ? "disabled" : ""}>
              Salvar
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      tbody.querySelectorAll(".btn-salvar-usuario").forEach(btn => {
        btn.addEventListener("click", () => salvarUsuario(btn.dataset.id, tbody, btn));
      });
    }

    /* ==========================================================================
       SALVAR ALTERAÇÕES DO USUÁRIO
       ========================================================================== */
    async function salvarUsuario(idUser, tbody, btn) {
      const selectTipo = tbody.querySelector(`.select-alterar-tipo[data-id="${idUser}"]`);
      const selectStatus = tbody.querySelector(`.select-alterar-status[data-id="${idUser}"]`);
      const inputEmpresa = tbody.querySelector(`.input-empresa[data-id="${idUser}"]`);

      const novoTipo = Number(selectTipo.value);
      const novoStatus = selectStatus.value;
      const novaEmpresa = inputEmpresa.value.trim();

      const linha = btn.closest("tr");
      linha.querySelectorAll("button, select, input").forEach(el => (el.disabled = true));
      btn.textContent = "Salvando...";

      try {
        await updateDoc(doc(db, "users", idUser), {
          tipo: novoTipo,
          status: novoStatus,
          empresa: novaEmpresa,
          atualizadoEm: serverTimestamp()
        });

        await mostrarAlerta("Usuário atualizado com sucesso!", { titulo: "Usuário atualizado", tipo: "sucesso" });
        await carregarTodosUsuarios();
        carregarResumoPendentes();
      } catch (err) {
        console.error(err);
        await mostrarAlerta("Erro ao atualizar o usuário.", { titulo: "Erro", tipo: "erro" });
      } finally {
        linha.querySelectorAll("button, select, input").forEach(el => (el.disabled = false));
        btn.textContent = "Salvar";
      }
    }

    // Ouvintes dos filtros
    document.getElementById("filtro-busca").addEventListener("input", renderizarTabela);
    document.getElementById("filtro-status").addEventListener("change", renderizarTabela);

    /* ==========================================================================
       UTILITÁRIOS
       ========================================================================== */
    function escapeHtml(texto) {
      const div = document.createElement("div");
      div.textContent = texto ?? "";
      return div.innerHTML;
    }
  </script>
</body>
</html>
