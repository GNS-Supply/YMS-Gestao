<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f2942">
  <title>Agendamento de Pátio - Recuperar Senha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-wrap">
    <div class="login-card">
      <div class="logo"><svg width="26" height="26" class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"></circle><path d="M11 12L21 2"></path><path d="M17 6l3 3"></path><path d="M14 9l3 3"></path></svg> Recuperar Senha</div>
      <div class="subtitulo">Informe seu e-mail para receber o link de redefinição</div>

      <form id="recuperar-form">
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" required autocomplete="username">
        </div>
        <button type="submit" class="btn-primario">Enviar Link de Redefinição</button>
        <div class="erro" id="recuperar-error"></div>
        <div class="sucesso" id="recuperar-sucesso"></div>
      </form>

      <div class="login-links">
        <a href="index.html">Voltar para o login</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth } from "./firebase-config.js";
    import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const form = document.getElementById("recuperar-form");
    const errorBox = document.getElementById("recuperar-error");
    const sucessoBox = document.getElementById("recuperar-sucesso");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.textContent = "";
      sucessoBox.textContent = "";

      const email = document.getElementById("email").value.trim();
      const btn = form.querySelector("button[type=submit]");
      btn.disabled = true;
      btn.textContent = "Enviando...";

      try {
        await sendPasswordResetEmail(auth, email);
      } catch (err) {
        // Não distingue "usuário não encontrado" dos demais erros,
        // para não revelar quais e-mails estão cadastrados no sistema.
        console.error(err);
      } finally {
        sucessoBox.textContent = "Se este e-mail estiver cadastrado, você receberá um link para redefinir a senha em instantes.";
        btn.disabled = false;
        btn.textContent = "Enviar Link de Redefinição";
        form.reset();
      }
    });
  </script>
</body>
</html>
