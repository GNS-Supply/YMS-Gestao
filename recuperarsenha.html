<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento de Pátio - Recuperar Senha</title>
  <link rel="stylesheet" href="Style.css">
</head>
<body>

  <div class="login-wrap">
    <div class="login-card">
      <div class="logo">🔑 Recuperar Senha</div>
      <div class="subtitulo">Informe seu e-mail para receber o link de redefinição</div>

      <form id="recuperar-form">
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" required autocomplete="username">
        </div>
        <button type="submit" class="btn-primario">Enviar Link de Redefinição</button>
        <div class="erro" id="recuperar-error"></div>
        <div class="sucesso" id="recuperar-sucesso"></div>
      </form>

      <div class="login-links">
        <a href="index.html">Voltar para o login</a>
      </div>
    </div>
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="recuperarsenha.js"></script>
</body>
</html>
